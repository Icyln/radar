name: Scheduled Monitoring

on:
  schedule:
    # Cost-aware private-repository default: twice per hour, deliberately away
    # from minute 0 where GitHub documents higher scheduled-workflow load.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-scheduled-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: radar/backend
    env:
      ENVIRONMENT: worker
      LOG_LEVEL: INFO
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MONITOR_RUN_TRIGGER: github-actions
      MONITOR_EXTERNAL_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
      MONITOR_MAX_CONCURRENCY: "3"
      PHASE1_MAX_NOTIFICATIONS_PER_RUN: "50"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: radar/backend/pyproject.toml

      - name: Install Radar worker
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate worker secrets
        run: python -m app.scripts.check_worker_config --require-telegram --require-remote-database

      - name: Monitor watched companies
        run: >-
          python -m app.workers.monitor
          --scope watchlist
          --batch-size 50
          --min-age-minutes 25
          --max-concurrency 3
          --allow-partial-failures

      - name: Monitor non-watched HIGH sources
        run: >-
          python -m app.workers.monitor
          --scope registry
          --priority high
          --batch-size 25
          --min-age-minutes 25
          --max-concurrency 3
          --allow-partial-failures

      - name: Monitor non-watched NORMAL sources
        run: >-
          python -m app.workers.monitor
          --scope registry
          --priority normal
          --batch-size 50
          --min-age-minutes 55
          --max-concurrency 3
          --allow-partial-failures

      - name: Monitor non-watched LOW sources
        run: >-
          python -m app.workers.monitor
          --scope registry
          --priority low
          --batch-size 100
          --min-age-minutes 235
          --max-concurrency 3
          --allow-partial-failures
